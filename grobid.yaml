# Custom GROBID config for alcanzai
# Mounted into container at /opt/grobid/grobid-home/config/grobid.yaml
#
# Key changes from default:
#   - modelPreload: false  → models load on first request, not at startup
#   - funding-acknowledgement model removed (unused, slow to load)
#   - concurrency reduced to match typical dev machine

grobid:
  grobidHome: "grobid-home"
  temp: "tmp"
  nativelibrary: "lib"

  pdf:
    pdfalto:
      path: "pdfalto"
      memoryLimitMb: 6096
      timeoutSec: 120
    blocksMax: 200000
    tokensMax: 1000000

  consolidation:
    service: "crossref"
    crossref:
      mailto:
      token:

  proxy:
    host:
    port:

  corsAllowedOrigins: "*"
  corsAllowedMethods: "OPTIONS,GET,PUT,POST,DELETE,HEAD"
  corsAllowedHeaders: "X-Requested-With,Content-Type,Accept,Origin"

  languageDetectorFactory: "org.grobid.core.lang.impl.CybozuLanguageDetectorFactory"
  sentenceDetectorFactory: "org.grobid.core.lang.impl.OpenNLPSentenceDetectorFactory"

  concurrency: 4

  poolMaxWait: 1

  delft:
    install: "../delft"
    pythonVirtualEnv:

  wapiti:
    nbThreads: 0

  # false = load models on first request instead of all at startup.
  # Startup is instant; first PDF request pays the load cost instead.
  # Much better for dev/batch use on a machine with slow model loading.
  modelPreload: false

server:
  type: custom
  applicationConnectors:
  - type: http
    port: 8070
  adminConnectors:
  - type: http
    port: 8071
  registerDefaultExceptionMappers: false
  requestLog:
    appenders: []

logging:
  level: INFO
  loggers:
    org.apache.pdfbox.pdmodel.font.PDSimpleFont: "OFF"
    org.glassfish.jersey.internal: "OFF"
    com.squarespace.jersey2.guice.JerseyGuiceUtils: "OFF"
  appenders:
    - type: console
      threshold: WARN
      timeZone: UTC
    - type: file
      currentLogFilename: logs/grobid-service.log
      threshold: INFO
      archive: true
      archivedLogFilenamePattern: logs/grobid-service-%d.log
      archivedFileCount: 5
      timeZone: UTC
