# Docker Compose file - defines services that run in containers
# This sets up GROBID for PDF processing

services:
  # GROBID - scholarly PDF parser
  # Extracts structured data (title, authors, citations) from academic PDFs
  grobid:
    # Pre-built GROBID image from Docker Hub
    image: grobid/grobid:0.8.2
    
    # Expose GROBID's API on port 8070
    # You'll send PDFs to http://localhost:8070/api/processFulltextDocument
    ports:
      - "8070:8070"
    
    # Resource limits - GROBID can be memory-hungry
    # Adjust based on your server's capacity
    deploy:
      resources:
        limits:
          memory: 8G    # Max 8GB RAM, GROBID is a hungry caterpillar indeed
        reservations:
          memory: 2G    # Reserve 2GB
    
    # Keep container running even if it crashes
    restart: unless-stopped
    
    # Mount custom config forcing all models to engine: "wapiti" (no DeLFT/TensorFlow).
    # Required on Apple Silicon: grobid/grobid:0.8.2 is AMD64-only; TensorFlow in that
    # image requires AVX instructions which QEMU doesn't emulate, causing a hard crash.
    # All wapiti + modelPreload:false = fast startup, no TF ever loaded.
    volumes:
      - ./grobid.yaml:/opt/grobid/grobid-home/config/grobid.yaml:ro

